<script>
        const ratings = {
            punctuality: 0,
            performance: 0,
            professionalism: 0,
            communication: 0
        };

        function setRating(category, value) {
            ratings[category] = value;
            const container = document.querySelector(`[data-category="${category}"]`);
            const stars = container.querySelectorAll('.star');
            
            stars.forEach((star, index) => {
                if (index < value) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });

            // Micro-interaction: quick pop
            container.classList.add('scale-105');
            setTimeout(() => container.classList.remove('scale-105'), 150);
        }

        function submitRating() {
            // Check if all ratings are filled
            const filled = Object.values(ratings).every(v => v > 0);
            
            // For demo purposes, we'll just show the success state
            const formState = document.getElementById('rating-form-state');
            const successState = document.getElementById('thank-you-state');
            const card = document.getElementById('rating-container');

            // Add exit animation
            formState.classList.add('opacity-0', 'scale-95');
            
            setTimeout(() => {
                formState.classList.add('hidden');
                successState.classList.remove('hidden');
                successState.classList.add('flex');
                
                // Trigger confetti or simple color pop effect if desired
                card.style.borderColor = '#b7d507';
            }, 300);
        }

        function resetState() {
            // Logic to go back to dashboard or reset
            window.location.reload();
        }
    </script>
