name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  # Everything here runs on a clean checkout with no secrets and no database,
  # so it works on forks and on a freshly cloned repo.
  checks:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # postinstall runs `prisma generate`, which needs the schema but not a
      # reachable database.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (api + web)
        run: npm run typecheck

      - name: Lint (web)
        run: npm run lint:web

      - name: Unit tests (api)
        run: npm run test:api

  # End-to-end tests need a real Clerk instance and a database, so they only
  # run once those secrets exist. Without them the job is skipped rather than
  # failing red for a reason nobody can fix from a pull request.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    if: ${{ github.event_name == 'push' }}
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - name: Check the required secrets are configured
        id: guard
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping e2e: set the E2E_DATABASE_URL, E2E_CLERK_PUBLISHABLE_KEY and E2E_CLERK_SECRET_KEY repository secrets to enable this job."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.guard.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Apply database migrations
        if: steps.guard.outputs.ready == 'true'
        run: npm run db:migrate

      # The suite is run against a production build on purpose. Against `next
      # dev` each route compiles on first request, which pushes plain
      # navigations past the Playwright timeout and produces mass failures that
      # look like product defects but are not.
      - name: Build web (production)
        if: steps.guard.outputs.ready == 'true'
        run: npm run build:web

      - name: Start API and web
        if: steps.guard.outputs.ready == 'true'
        run: |
          npm run start:prod -w @lime/api & echo $! > /tmp/api.pid
          npm run start -w @lime/web & echo $! > /tmp/web.pid
          npx wait-on -t 120000 http://localhost:3001/health http://localhost:3000

      # CI=true makes playwright.config skip its own webServer block, so it
      # uses the servers started above.
      - name: Run Playwright tests
        if: steps.guard.outputs.ready == 'true'
        run: npx playwright test
        working-directory: apps/web

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.guard.outputs.ready == 'true' }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30
